<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhishGuard - محلل روابط التصيد: WHOIS، SSL، مؤشرات الخطورة، VirusTotal و Google Safe Browsing">
  <title>{% block title %}PhishGuard | محلل روابط التصيد{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-transparent position-absolute w-100">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}"><i class="bi bi-shield-lock-fill"></i> PhishGuard</a>
      <span class="badge rounded-pill text-bg-light opacity-75">v{{ version }}</span>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="text-center text-muted small py-4">
    PhishGuard v{{ version }} — أداة تعليمية للتوعية الأمنية. النتيجة تقديرية ولا تغني عن الحذر.
    · <a href="{{ url_for('main.health') }}" class="text-muted">API status</a>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
