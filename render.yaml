# One-click deploy on Render (free plan) using the Dockerfile.
services:
  - type: web
    name: phishguard
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "15"
      # One worker so the in-memory rate limit is shared by every request.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUSTED_PROXIES
        value: "1"
      # Render sits behind Cloudflare, which always sets this to the real visitor IP.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      # Optional: add your own keys in the Render dashboard to enable reputation checks.
      - key: VT_API_KEY
        sync: false
      - key: GSB_API_KEY
        sync: false
