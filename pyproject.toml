[project]
name = "phishguard"
version = "1.0.0"
description = "Phishing URL Analyzer: heuristics, WHOIS, SSL, DNS, VirusTotal & Google Safe Browsing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef Hussein" }]
keywords = ["phishing", "security", "url-analysis", "whois", "ssl", "virustotal", "flask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
